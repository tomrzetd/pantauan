name: PANTAUAN — GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validasi JavaScript dan larangan data rahasia di frontend
        run: |
          node --check app.js
          node --check sw.js
          node tests/public-registry.test.mjs
          test -f index.html && test -f manifest.webmanifest && test -f schools.json
          ! grep -rE 'BT_LICENSE_HMAC_KEY|SHEET_ID=|ADMIN_KEY_SHA256=' index.html app.js styles.css sw.js manifest.webmanifest
      - name: Publish HANYA aset PWA publik
        run: |
          mkdir -p _site/assets
          cp index.html app.js styles.css sw.js schools.json manifest.webmanifest .nojekyll _site/
          cp assets/icon.svg _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
